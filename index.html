<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunBox ⚡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #312e81, #111827);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 30px;
      font-size: 17px;
    }

    .box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 30px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      outline: none;
      margin-bottom: 20px;
      font-size: 16px;
      background: #f8fafc;
      color: #111827;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .result {
      margin-top: 25px;
      min-height: 90px;
      padding: 20px;
      border-radius: 15px;
      background: rgba(0,0,0,0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      line-height: 1.5;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .actions button {
      background: #334155;
      color: white;
      padding: 10px 18px;
    }

    .recent {
      margin-top: 25px;
      text-align: left;
    }

    .recent h3 {
      margin-bottom: 10px;
    }

    .recent-item {
      background: rgba(255,255,255,0.06);
      padding: 10px;
      border-radius: 10px;
      margin-top: 7px;
      color: #cbd5e1;
      font-size: 14px;
    }

    footer {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .box {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ FunBox</h1>
    <p class="subtitle">
      Bored ho? Ek button dabao. Kuch interesting mil jayega.
    </p>

    <div class="box">

      <input
        type="text"
        id="nameInput"
        placeholder="Apna naam likho..."
      >

      <div class="buttons">
        <button onclick="generate('excuse')">📝 Creative Excuse</button>
        <button onclick="generate('future')">🔮 Future Prediction</button>
        <button onclick="generate('fact')">🧠 Interesting Fact</button>
        <button onclick="generate('roast')">😈 Roast Me</button>
        <button onclick="surprise()">✨ Surprise Me</button>
      </div>

      <div class="result" id="result">
        Yahan tumhara result aayega 😎
      </div>

      <div class="actions">
        <button onclick="copyResult()">📋 Copy</button>
        <button onclick="clearResult()">🗑️ Clear</button>
      </div>

      <div class="recent">
        <h3>🕘 Recent Results</h3>
        <div id="recentResults"></div>
      </div>

    </div>

    <footer>
      FunBox • Made for random fun ⚡
    </footer>

  </div>

  <script>

    const data = {

      excuse: [
        "Bhai kaam karne baitha tha, phir phone ne bola: pehle mujhe dekh lo.",
        "Main late nahi tha, bas meri timing thodi independent hai.",
        "Kaam almost complete tha... bas 'almost' thoda zyada bada ho gaya.",
        "Maine socha 5 minute rest kar leta hoon. Phir clock ne personal attack kar diya.",
        "Plan ekdum solid tha, bas execution ne cooperate karne se mana kar diya.",
        "Main karne wala tha, sach mein. Bas 'karne wala' phase thoda lamba chal gaya.",
        "Mera alarm baj gaya tha, meri motivation nahi.",
        "Kaam start karne se pehle thoda research zaroori tha... research abhi chal rahi hai.",
        "Maine task dekha aur decide kiya ki iske liye mentally prepare hona zaroori hai.",
        "Aaj productive hona tha, lekin din ka apna hi agenda tha."
      ],

      future: [
        "Aaj tumhe ek unexpected good news mil sakti hai.",
        "Tumhara next big idea random time par aayega.",
        "Aane wale dinon mein tumhari koi boring situation unexpectedly funny banegi.",
        "Tum kuch naya seekhoge aur pehle sochoge: ye pehle kyun nahi seekha?",
        "Tumhari ek chhoti si decision future mein kaafi useful ho sakti hai.",
        "Kisi random moment mein tumhe ek surprisingly smart idea aayega.",
        "Tumhara next achievement shayad utna dramatic na ho, par kaafi satisfying hoga.",
        "Jaldi hi tum kisi problem ka simple solution discover karoge."
      ],

      fact: [
        "Octopus ke teen hearts hote hain.",
        "Banana technically ek berry hai, lekin strawberry botanical berry nahi hai.",
        "Honey properly stored ho to bahut long time tak edible reh sakta hai.",
        "Sharks trees se bhi purane hain.",
        "Space mein sound travel nahi karta kyunki wahan air nahi hoti.",
        "Koalas ke fingerprints humans ke fingerprints se surprisingly similar hote hain.",
        "Lightning ka temperature surface of the Sun se bhi zyada ho sakta hai.",
        "A day on Venus is longer than a Venus year."
      ],

      roast: [
        "Tera confidence dekh ke lagta hai preparation optional hai.",
        "Tere plans PowerPoint presentation jaise hain: dekhne mein impressive, implementation pending.",
        "Tere ideas ka speed 5G hai, execution ka network kabhi-kabhi E pe aa jata hai.",
        "Tu itna plan karta hai ki plan khud thak jata hai.",
        "Tera focus Wi-Fi signal jaisa hai: kabhi full, kabhi pata hi nahi kahan gaya.",
        "Teri productivity ka loading screen kaafi impressive hai.",
        "Tu kaam start karne se pehle itna setup karta hai ki kaam khud retire ho jaye.",
        "Tere '5 minute' ka definition alag hi timezone mein chalta hai.",
        "Tere goals serious hain, bas unka attendance thoda low hai.",
        "Tu shortcut dhoondte-dhoondte kabhi-kabhi original road hi bhool jata hai."
      ]

    };

    const used = {
      excuse: [],
      future: [],
      fact: [],
      roast: []
    };

    let recent = [];

    function getRandom(type) {

      if (used[type].length === data[type].length) {
        used[type] = [];
      }

      let index;

      do {
        index = Math.floor(Math.random() * data[type].length);
      } while (used[type].includes(index));

      used[type].push(index);

      return data[type][index];
    }

    function generate(type) {

      const name =
        document.getElementById("nameInput").value.trim();

      let text = getRandom(type);

      if (name) {
        text = name + ", " + text;
      }

      showResult(text);
    }

    function surprise() {

      const types = [
        "excuse",
        "future",
        "fact",
        "roast"
      ];

      const randomType =
        types[Math.floor(Math.random() * types.length)];

      generate(randomType);
    }

    function showResult(text) {

      document.getElementById("result").textContent = text;

      recent.unshift(text);

      if (recent.length > 5) {
        recent.pop();
      }

      updateRecent();
    }

    function updateRecent() {

      const box =
        document.getElementById("recentResults");

      box.innerHTML = "";

      recent.forEach(item => {

        const div =
          document.createElement("div");

        div.className = "recent-item";

        div.textContent = item;

        box.appendChild(div);

      });
    }

    function copyResult() {

      const text =
        document.getElementById("result").textContent;

      navigator.clipboard.writeText(text);

    }

    function clearResult() {

      document.getElementById("result").textContent =
        "Yahan tumhara result aayega 😎";

    }

  </script>

</body>
</html>
