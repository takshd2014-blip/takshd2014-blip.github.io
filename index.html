<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FunBox ⚡</title>
  <link rel="icon" type="image/png" href="22.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #4c1d95 0%, transparent 35%),
        radial-gradient(circle at bottom right, #831843 0%, transparent 30%),
        linear-gradient(135deg, #080b16, #17122b, #080b16);
      color: white;
      display: flex;
      justify-content: center;
      padding: 35px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .logo {
      width: 125px;
      height: 125px;
      object-fit: cover;
      border-radius: 28px;
      margin-bottom: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .hero-badge {
      display: inline-block;
      padding: 7px 15px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 10px;
    }

    .hero-title span {
      color: #a78bfa;
    }

    .hero-subtitle {
      max-width: 650px;
      margin: 0 auto 30px;
      color: #94a3b8;
      line-height: 1.6;
      font-size: 16px;
    }

    .box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 26px;
      padding: 30px;
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 13px;
      border: none;
      outline: none;
      margin-bottom: 18px;
      font-size: 16px;
      background: #f8fafc;
      color: #111827;
    }

    input:focus {
      box-shadow: 0 0 0 3px rgba(167,139,250,0.3);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      padding: 15px;
      border-radius: 13px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: 0.2s ease;
      background: #f8fafc;
      color: #111827;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(0);
    }

    .surprise {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, #7c3aed, #db2777);
      color: white;
    }

    .result {
      margin-top: 25px;
      min-height: 140px;
      padding: 25px;
      border-radius: 17px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .actions button {
      background: #334155;
      color: white;
      padding: 10px 20px;
      font-size: 13px;
    }

    .recent {
      margin-top: 28px;
      text-align: left;
    }

    .recent h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .recent-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 11px 13px;
      border-radius: 11px;
      margin-top: 7px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      margin-top: 22px;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 14px;
      }

      .hero-title {
        font-size: 45px;
      }

      .hero-subtitle {
        font-size: 14px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .surprise {
        grid-column: auto;
      }

      .box {
        padding: 20px;
      }

      .logo {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <img src="22.png" alt="FunBox Logo" class="logo">

  <div class="hero-badge">
    ⚡ RANDOM FUN • ZERO BORING
  </div>

  <h1 class="hero-title">
    Fun<span>Box</span>
  </h1>

  <p class="hero-subtitle">
    Boredom ka ilaaj nahi mila?
    Excuses, roasts, facts, predictions aur naam ki shayari —
    sab ek hi jagah.
  </p>

  <div class="box">

    <input
      type="text"
      id="nameInput"
      placeholder="Apna naam likho..."
      maxlength="30"
    >

    <div class="buttons">

      <button onclick="generate('excuse')">
        📝 Excuse Generator
      </button>

      <button onclick="generate('future')">
        🔮 Future Scanner
      </button>

      <button onclick="generate('fact')">
        🧠 Random Fact
      </button>

      <button onclick="generate('roast')">
        😈 Roast Me
      </button>

      <button onclick="generateShayari()">
        💫 Naam Ki Shayari
      </button>

      <button class="surprise" onclick="surprise()">
        🎲 Randomize My Fate
      </button>

    </div>

    <div class="result" id="result">
      Yahan tumhara result aayega 😎
    </div>

    <div class="actions">
      <button onclick="copyResult()">📋 Copy</button>
      <button onclick="clearResult()">🗑️ Clear</button>
    </div>

    <div class="recent">
      <h3>🕘 Recent Results</h3>
      <div id="recentResults"></div>
    </div>

  </div>

  <footer>
    FunBox • Because boring is overrated ⚡
  </footer>

</div>

<script>

  /* =========================
     CONTENT
  ========================= */

  const data = {

    excuse: [
      "Kaam karne baitha tha, phir phone haath mein aa gaya. Phone jeet gaya.",
      "Main late nahi tha. Bas meri timing normal logon se thodi advanced hai.",
      "5 minute ka break liya tha. Time ne personal grudge le liya.",
      "Plan solid tha. Execution ne resignation de diya.",
      "Kaam almost complete tha. 'Almost' bhi ek achievement hai.",
      "Alarm baja, aankh khuli, decision hua — kal se pakka.",
      "Task dekha aur laga pehle proper planning zaroori hai. Planning abhi chal rahi hai.",
      "Main busy tha. Kis cheez mein tha, ye investigation ka subject hai.",
      "Deadline ignore nahi ki. Bas thoda distance maintain kiya.",
      "Mera laptop open tha. Technically main kaam ke environment mein tha.",
      "Motivation aayi thi. Main ready nahi tha. Woh chali gayi.",
      "Kaam start karne wala tha, phir ek random thought ne career badal diya."
    ],

    future: [
      "Aaj tum kuch productive karoge. Haan, prediction mein risk hai.",
      "Jaldi hi tum ek problem solve karoge jo tumne khud create ki thi.",
      "Tumhe brilliant idea milega. Execute karna optional lag sakta hai.",
      "Ek din tum bina procrastinate kiye kaam complete karoge. Historic moment.",
      "Tumhari productivity achanak online hogi. Date classified hai.",
      "Future mein tum apne purane decisions dekh kar bologe: interesting choice.",
      "Ek unexpected good moment aayega. Screenshot ready rakhna.",
      "Tum kuch naya seekhoge aur 10 minute baad expert advice dene lagoge.",
      "Ek plan actually plan ke according chalega. Universe bhi kabhi-kabhi try karta hai.",
      "Tum ek din itne organized hoge ki khud ko suspicious lagega.",
      "Tumhara motivation wapas aayega. Bas uska GPS thoda kharab hai.",
      "Aane wale time mein tum ek smart decision loge. Details abhi confidential hain."
    ],

    fact: [
      "Octopus ke 3 hearts hote hain. Phir bhi tumse zyada emotionally stable lagte hain.",
      "Banana technically berry hai, strawberry technically nahi. Nature bhi confusion create karti hai.",
      "Sharks trees se bhi purane hain. Ancient management chal raha hai.",
      "Venus par ek day uske ek year se bhi lamba hota hai. Monday wahan dangerous hoga.",
      "Butterflies feet se taste karti hain. Food review literally pairon se.",
      "Wombat cube-shaped poop karta hai. Science ne geometry bhi add kar di.",
      "Crows ke group ko murder kaha jaata hai. Birds ke naam bhi dramatic hain.",
      "Lightning Sun ki surface se bhi hotter ho sakti hai. Nature casually overreact karti hai.",
      "Koala fingerprints humans se surprisingly similar hote hain. Suspicious.",
      "Cows best friends bana sakti hain. Unki social life bhi sorted hai.",
      "Space mein sound travel nahi karta. Isliye space argument ka winner decide nahi hota.",
      "Honey properly stored ho toh bahut long time tak edible reh sakta hai. Honey has better planning."
    ],

    roast: [
      "Tera confidence dekh ke lagta hai preparation banned hai.",
      "Tere plans itne detailed hain ki execution unhe dekh ke resign kar deta hai.",
      "Tera 5 minute aur normal duniya ka 5 minute alag species hain.",
      "Teri productivity ka status: last seen long ago.",
      "Tu procrastinate nahi karta. Tu future wale khud ko surprise deta hai.",
      "Tera focus Wi-Fi jaisa hai — important time pe signal gayab.",
      "Tere ideas Formula 1 ki speed se aate hain, execution bullock cart ki.",
      "Tera brain: Let's do it. Tera body: Kal se pakka.",
      "Tu multitasking nahi karta. Tu multiple cheezein incomplete rakhta hai.",
      "Tu 'kal se' ka itna loyal hai ki kal bhi tujhe avoid karta hoga.",
      "Tere excuses itne polished hain ki kaam se zyada effort unpe laga hai.",
      "Tu shortcut dhoondte-dhoondte kabhi-kabhi destination bhool jata hai."
    ]
  };


  /* =========================
     USED RESULTS
  ========================= */

  const used = {
    excuse: [],
    future: [],
    fact: [],
    roast: [],
    shayari: []
  };

  let recent = [];


  /* =========================
     RANDOM WITHOUT REPEAT
  ========================= */

  function getRandom(type) {

    if (used[type].length >= data[type].length) {
      used[type] = [];
    }

    let index;

    do {
      index = Math.floor(Math.random() * data[type].length);
    } while (used[type].includes(index));

    used[type].push(index);

    return data[type][index];
  }


  /* =========================
     NORMAL GENERATOR
  ========================= */

  function generate(type) {

    const name =
      document.getElementById("nameInput").value.trim();

    let text = getRandom(type);

    if (name) {
      text = name + ", " + text;
    }

    showResult(text);
  }


  /* =========================
     NAME RHYME DETECTOR
  ========================= */

  function getRhymeData(name) {

    const n = name.toLowerCase().replace(/\s+/g, "");

    /* A / YA */

    if (
      n.endsWith("iya") ||
      n.endsWith("riya") ||
      n.endsWith("iya")
    ) {
      return {
        words: ["diya", "piya", "jiya", "duniya"]
      };
    }

    if (
      n.endsWith("a") ||
      n.endsWith("ya")
    ) {
      return {
        words: ["nirala", "ujala", "masala", "hungama"]
      };
    }


    /* AN / AAN / N */

    if (
      n.endsWith("man") ||
      n.endsWith("an") ||
      n.endsWith("aan") ||
      n.endsWith("n")
    ) {
      return {
        words: ["shaan", "tufaan", "armaan", "jaan"]
      };
    }


    /* I / EE */

    if (
      n.endsWith("i") ||
      n.endsWith("ee")
    ) {
      return {
        words: ["sahi", "wahi", "tabahi", "kahi"]
      };
    }


    /* U / OO */

    if (
      n.endsWith("u") ||
      n.endsWith("oo")
    ) {
      return {
        words: ["guru", "shuru", "babu", "bekabu"]
      };
    }


    /* R / AR */

    if (
      n.endsWith("ar") ||
      n.endsWith("er")
    ) {
      return {
        words: ["dhamakedar", "zabardast yaar", "taiyaar", "bekaar"]
      };
    }


    /* DEFAULT */

    return {
      words: ["kamaal", "bawaal", "sawaal", "dhamaal"]
    };
  }


  /* =========================
     DYNAMIC SHAYARI
  ========================= */

  function createShayari(name) {

    const rhyme =
      getRhymeData(name).words;

    const a = rhyme[0];
    const b = rhyme[1];
    const c = rhyme[2];
    const d = rhyme[3];


    const templates = [

`${name} ka naam, ${a} kamaal,
Confidence full, logic thoda bawaal,
Kaam ka poocha toh bola "kal",
${name} ki productivity — ${d}! 💀`,

`${name} ki entry, scene ${a},
Attitude dekho, level ${b},
Task mila toh face hua ${c},
Aur kaam gaya seedha ${d}. 😭`,

`${name} ka naam sunke laga ${a},
Phir kaam dekha — pura ${b},
Planning mein banda ek number,
Execution mein direct ${d}. 💀`,

`${name} ke sapne bade ${a},
Plans bhi lagte hain ${b},
Deadline jab saamne aaye,
Excuses ban jaate hain ${d}. 😭`,

`${name} ka swag hai ${a},
Confidence ka koi nahi ${b},
Kaam ki baari aate hi,
System bolta hai — ${d}! 💀`,

`${name} bole main hoon ${a},
Reality bole thoda ${b},
Kaam ke time gayab banda,
Milta hai sirf "kal" mein ${d}. 😭`,

`${name} ki vibe full ${a},
Baaton mein level ${b},
Task diya toh silence aisa,
Jaise phone mein nahi ho ${d}. 💀`,

`${name} ka naam hai ${a},
Par kaam ka scene ${b},
Motivation aati do minute,
Phir bolti hai — "main chalti, bye." 😭`

    ];

    return templates[
      Math.floor(Math.random() * templates.length)
    ];
  }


  /* =========================
     SHAYARI GENERATOR
  ========================= */

  function generateShayari() {

    const name =
      document.getElementById("nameInput").value.trim();

    if (!name) {
      showResult(
        "Pehle naam daal 💀\nBlank naam ka rhyme nikalne ke liye NASA bhi busy hai."
      );
      return;
    }

    const shayari = createShayari(name);

    showResult(shayari);
  }


  /* =========================
     SURPRISE
  ========================= */

  function surprise() {

    const types = [
      "excuse",
      "future",
      "fact",
      "roast"
    ];

    const randomType =
      types[Math.floor(Math.random() * types.length)];

    generate(randomType);
  }


  /* =========================
     RESULT
  ========================= */

  function showResult(text) {

    document.getElementById("result").textContent = text;

    recent.unshift(text);

    if (recent.length > 5) {
      recent.pop();
    }

    updateRecent();
  }


  /* =========================
     RECENT
  ========================= */

  function updateRecent() {

    const box =
      document.getElementById("recentResults");

    box.innerHTML = "";

    recent.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "recent-item";
      div.textContent = item;

      box.appendChild(div);
    });
  }


  /* =========================
     COPY
  ========================= */

  function copyResult() {

    const text =
      document.getElementById("result").textContent;

    navigator.clipboard.writeText(text);
  }


  /* =========================
     CLEAR
  ========================= */

  function clearResult() {

    document.getElementById("result").textContent =
      "Yahan tumhara result aayega 😎";

  }

</script>

</body>
</html>
