<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FunBox ⚡</title>
  <link rel="icon" type="image/png" href="22.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #4c1d95 0%, transparent 35%),
        radial-gradient(circle at bottom right, #831843 0%, transparent 30%),
        linear-gradient(135deg, #080b16, #17122b, #080b16);
      color: white;
      display: flex;
      justify-content: center;
      padding: 35px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    /* HERO */

    .logo {
      width: 125px;
      height: 125px;
      object-fit: cover;
      border-radius: 28px;
      margin-bottom: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .hero-badge {
      display: inline-block;
      padding: 7px 15px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 10px;
    }

    .hero-title span {
      color: #a78bfa;
    }

    .hero-subtitle {
      max-width: 650px;
      margin: 0 auto 30px;
      color: #94a3b8;
      line-height: 1.6;
      font-size: 16px;
    }

    /* MAIN BOX */

    .box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 26px;
      padding: 30px;
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 13px;
      border: 1px solid rgba(0,0,0,0.08);
      outline: none;
      margin-bottom: 18px;
      font-size: 16px;
      background: #f8fafc;
      color: #111827;
    }

    input:focus {
      box-shadow: 0 0 0 3px rgba(167,139,250,0.3);
    }

    /* BUTTONS */

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      padding: 15px;
      border-radius: 13px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: 0.2s ease;
      background: #f8fafc;
      color: #111827;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(0);
    }

    .surprise {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, #7c3aed, #db2777);
      color: white;
    }

    /* RESULT */

    .result {
      margin-top: 25px;
      min-height: 120px;
      padding: 25px;
      border-radius: 17px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      line-height: 1.7;
      white-space: pre-line;
    }

    /* ACTIONS */

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .actions button {
      background: #334155;
      color: white;
      padding: 10px 20px;
      font-size: 13px;
    }

    /* RECENT */

    .recent {
      margin-top: 28px;
      text-align: left;
    }

    .recent h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .recent-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 11px 13px;
      border-radius: 11px;
      margin-top: 7px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      margin-top: 22px;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 600px) {

      body {
        padding: 25px 14px;
      }

      .hero-title {
        font-size: 45px;
      }

      .hero-subtitle {
        font-size: 14px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .surprise {
        grid-column: auto;
      }

      .box {
        padding: 20px;
      }

      .logo {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HERO -->

    <img src="22.png" alt="FunBox Logo" class="logo">

    <div class="hero-badge">
      ⚡ RANDOM FUN • ZERO BORING
    </div>

    <h1 class="hero-title">
      Fun<span>Box</span>
    </h1>

    <p class="hero-subtitle">
      Boredom ka ilaaj nahi mila?
      Excuses, roasts, facts, predictions aur naam ki shayari —
      sab ek hi jagah.
    </p>


    <!-- MAIN -->

    <div class="box">

      <input
        type="text"
        id="nameInput"
        placeholder="Apna naam likho..."
        maxlength="30"
      >

      <div class="buttons">

        <button onclick="generate('excuse')">
          📝 Excuse Generator
        </button>

        <button onclick="generate('future')">
          🔮 Future Scanner
        </button>

        <button onclick="generate('fact')">
          🧠 Random Fact
        </button>

        <button onclick="generate('roast')">
          😈 Roast Me
        </button>

        <button onclick="generateShayari()">
          💫 Naam Ki Shayari
        </button>

        <button class="surprise" onclick="surprise()">
          🎲 Randomize My Fate
        </button>

      </div>


      <!-- RESULT -->

      <div class="result" id="result">
        Yahan tumhara result aayega 😎
      </div>


      <!-- ACTIONS -->

      <div class="actions">

        <button onclick="copyResult()">
          📋 Copy
        </button>

        <button onclick="clearResult()">
          🗑️ Clear
        </button>

      </div>


      <!-- RECENT -->

      <div class="recent">

        <h3>🕘 Recent Results</h3>

        <div id="recentResults"></div>

      </div>

    </div>


    <footer>
      FunBox • Because boring is overrated ⚡
    </footer>

  </div>


  <script>

    /* =========================
       FUNBOX CONTENT
    ========================= */

    const data = {

      excuse: [

        "Bhai kaam karne baitha tha, phir phone haath mein aa gaya. Uske baad jo hua, woh history hai.",

        "Main late nahi tha, bas meri entry timing thodi cinematic hai.",

        "Kaam almost complete tha... phir maine decide kiya ki 'almost' bhi ek achievement hai.",

        "Maine 5 minute rest liya tha. Pata nahi calendar ne usse 2 ghante kaise bana diya.",

        "Plan ekdum solid tha. Bas execution ne bola: main nahi aa raha.",

        "Main kaam karne wala tha. Phir mera brain bola: pehle thoda kuch bhi kar lete hain.",

        "Alarm baj chuka tha. Main bhi jag gaya tha. Bas uthne ka decision pending tha.",

        "Task dekhte hi mujhe laga iske liye proper planning chahiye. Planning abhi tak chal rahi hai.",

        "Maine kaam postpone nahi kiya... bas future wale mujhe responsibility transfer kar di.",

        "Aaj productive hona tha. Lekin aaj bhi meri productivity ne mujhe disappoint kar diya.",

        "Main busy tha. Exactly kis cheez mein, ye abhi investigation ka subject hai.",

        "Kaam karne laga tha, phir ek random thought aaya. Ab wahi thought meri priority hai.",

        "Maine deadline ignore nahi ki. Bas hum dono ke beech thoda distance maintain kiya.",

        "Mera laptop open tha, isliye technically main kaam ke paas hi tha.",

        "Motivation aayi thi. Main ready nahi tha. Woh chali gayi."

      ],


      future: [

        "Aaj tum kuch productive karoge. Haan, mujhe bhi thoda doubt hai.",

        "Tumhara next big idea tab aayega jab tum usse note karne ke liye bilkul ready nahi hoge.",

        "Jaldi hi tum ek problem solve karoge... jo tumne khud create ki thi.",

        "Tumhari life mein ek unexpected good moment aayega. Screenshot lena mat bhoolna.",

        "Aane wale dinon mein tumhara confidence badega. Reason baad mein pata chalega.",

        "Tum kuch naya seekhoge aur 10 minute baad kisi aur ko expert advice doge.",

        "Tumhari ek random decision surprisingly useful niklegi. Miracle officially recorded.",

        "Jaldi hi tumhara koi plan actually plan ke according chalega. Historic moment.",

        "Tumhe ek brilliant idea milega. Usko execute karna tumhari problem hai.",

        "Future mein tum apne purane decisions ko dekhoge aur kahoge: interesting choice.",

        "Tumhari productivity ek din achanak online hogi. Exact date classified hai.",

        "Ek din tum bina procrastinate kiye kaam complete karoge. Researchers confused honge.",

        "Tumhari life mein paisa, success aur peace aayenge... order unknown hai.",

        "Tum ek din itna organized hoge ki khud ko hi suspicious lagega.",

        "Aane wale time mein tum ek aisa decision loge jiske baare mein baad mein kahoge: chalo dekhte hain."

      ],


      fact: [

        "Octopus ke 3 hearts hote hain. Aur phir bhi tumse zyada emotionally stable lagte hain.",

        "Banana technically berry hai, lekin strawberry technically nahi. Nature bhi kabhi-kabhi confusing hoti hai.",

        "Sharks trees se bhi purane hain. Matlab sharks literally ancient management hain.",

        "Venus par ek day uske ek year se bhi lamba hota hai. Matlab wahan Monday ka wait dangerous hai.",

        "Honey properly stored ho to bahut long time tak edible reh sakta hai. Honey ne bhi long-term planning kar rakhi hai.",

        "Space mein sound travel nahi karta. Isliye aliens ke saath argument karna thoda difficult hai.",

        "Lightning ka temperature Sun ki surface se bhi zyada ho sakta hai. Nature casually overreact karti hai.",

        "Koala ke fingerprints humans se surprisingly similar hote hain. Suspicious little creatures.",

        "Aapka brain khud pain feel nahi karta, despite processing pain signals. Brain: rules mere hain.",

        "Butterflies apne feet se taste karti hain. Hum khana muh se kha rahe hain aur ye log feet se review kar rahe hain.",

        "Cows ke best friends ho sakte hain. Matlab unki social life bhi sorted hai.",

        "Wombat cube-shaped poop karta hai. Science ne literally cube bana diya.",

        "Flamingos group mein so sakte hain. Matlab sleepover permanently organized hai.",

        "Some turtles breathe through their skin. Nature ne inke liye backup system bhi rakha hai.",

        "A group of crows is called a murder. Birds ke group names unnecessarily dramatic hain."

      ],


      roast: [

        "Tera confidence dekh ke lagta hai preparation sirf optional nahi, banned hai.",

        "Tere plans itne detailed hote hain ki execution unhe dekh ke resign kar deta hai.",

        "Tera '5 minute' aur normal duniya ka '5 minute' alag species ke hain.",

        "Teri productivity ka status: 'last seen long ago'.",

        "Tu procrastinate nahi karta. Tu future version of yourself ko surprise deta hai.",

        "Tera focus Wi-Fi jaisa hai — important time pe signal gayab.",

        "Tere goals serious hain. Bas unka attendance thoda embarrassing hai.",

        "Tu kaam start karne se pehle itni preparation karta hai ki kaam old news ho jata hai.",

        "Tere ideas Formula 1 ki speed se aate hain, execution bullock cart ki.",

        "Tera brain: 'Let's do it.' Tera body: 'Kal se pakka.'",

        "Tu busy zaroor lagta hai. Kaam bhi kabhi-kabhi mil jaye to maza aa jayega.",

        "Teri planning dekh ke lagta hai CEO banega. Execution dekh ke lagta hai intern bhi confused hai.",

        "Tu multitasking nahi karta. Tu ek saath multiple cheezein incomplete rakhta hai.",

        "Tera attention span itna short hai ki ye roast bhi shayad finish na kare.",

        "Tu deadline ko seriously leta hai — bas usually deadline ke 5 minute baad.",

        "Tere excuses itne polished hain ki kaam se zyada unpe effort laga hai.",

        "Tu shortcut dhoondte-dhoondte kabhi-kabhi destination hi bhool jata hai.",

        "Tera motivation guest appearance deta hai. Aata hai, 2 minute rukta hai, chala jata hai.",

        "Tu 'kal se' ka itna loyal hai ki kal bhi tujhe avoid karta hoga.",

        "Teri speed dekh ke lagta hai loading screen bhi tujhe impatient samajhti hai."

      ]

    };


    /* =========================
       RANDOM SYSTEM
    ========================= */

    const used = {
      excuse: [],
      future: [],
      fact: [],
      roast: []
    };

    let recent = [];


    function getRandom(type) {

      if (used[type].length === data[type].length) {
        used[type] = [];
      }

      let index;

      do {

        index =
          Math.floor(
            Math.random() * data[type].length
          );

      } while (
        used[type].includes(index)
      );

      used[type].push(index);

      return data[type][index];

    }


    /* =========================
       NORMAL GENERATOR
    ========================= */

    function generate(type) {

      const name =
        document
          .getElementById("nameInput")
          .value
          .trim();

      let text = getRandom(type);

      if (name) {
        text = name + ", " + text;
      }

      showResult(text);

    }


    /* =========================
       SHAYARI
    ========================= */

    function generateShayari() {

      const name =
        document
          .getElementById("nameInput")
          .value
          .trim();

      if (!name) {

        showResult(
          "Pehle naam daal bhai 😶\nNaam ke bina shayari kaise likhun?"
        );

        return;
      }


      const lower =
        name.toLowerCase();

      let shayari;


      if (
        lower.endsWith("a") ||
        lower.endsWith("ya")
      ) {

        shayari =
`${name} ka style hai nirala,
Entry kare to scene ho jaaye ujala,
Naam suna to mood hua mast,
${name} ke saamne boring rehna hai mana! 😎`;

      } else if (
        lower.endsWith("n") ||
        lower.endsWith("an")
      ) {

        shayari =
`${name} ka naam hai shaan,
Style mein full-on tufaan,
Jahan ${name} ki entry ho jaaye,
Wahan boring rehna mushkil kaam! 🔥`;

      } else if (
        lower.endsWith("i") ||
        lower.endsWith("ee")
      ) {

        shayari =
`${name} ki vibe hai hatke,
Problems bhaage jhatke,
Naam mein hi hai itni shine,
Scene ho jaaye instantly fine! ✨`;

      } else {

        shayari =
`${name} ka naam hai kamaal,
Personality ka alag hi sawaal,
Jahan ${name} aa jaye ek baar,
Wahan boring moment ki haar! 😎`;

      }


      showResult(shayari);

    }


    /* =========================
       SURPRISE
    ========================= */

    function surprise() {

      const types = [
        "excuse",
        "future",
        "fact",
        "roast"
      ];

      const randomType =
        types[
          Math.floor(
            Math.random() * types.length
          )
        ];

      generate(randomType);

    }


    /* =========================
       RESULT
    ========================= */

    function showResult(text) {

      document
        .getElementById("result")
        .textContent = text;


      recent.unshift(text);


      if (recent.length > 5) {
        recent.pop();
      }


      updateRecent();

    }


    /* =========================
       RECENT RESULTS
    ========================= */

    function updateRecent() {

      const box =
        document.getElementById(
          "recentResults"
        );

      box.innerHTML = "";


      recent.forEach(item => {

        const div =
          document.createElement("div");

        div.className =
          "recent-item";

        div.textContent =
          item;

        box.appendChild(div);

      });

    }


    /* =========================
       COPY
    ========================= */

    function copyResult() {

      const text =
        document
          .getElementById("result")
          .textContent;

      navigator.clipboard
        .writeText(text);

    }


    /* =========================
       CLEAR
    ========================= */

    function clearResult() {

      document
        .getElementById("result")
        .textContent =
        "Yahan tumhara result aayega 😎";

    }

  </script>

</body>
</html>
